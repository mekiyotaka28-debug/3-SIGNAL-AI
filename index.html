<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>3 Signal AI | Filter the Noise</title>    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%230b0e14%22 stroke=%22%2330363d%22 stroke-width=%222%22/><path d=%22M35 65 V55 M50 65 V45 M65 65 V35%22 stroke=%22url(%23g)%22 stroke-width=%228%22 stroke-linecap=%22round%22/><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%25%22 stop-color=%22%236366f1%22/><stop offset=%22100%25%22 stop-color=%22%2310b981%22/></linearGradient></defs></svg>">    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">    <style>        :root {            --bg: #05070a;            --card: #0d1117;            --primary: #6366f1;            --accent: #10b981;            --noise: #f43f5e;            --text: #f0f6fc;            --text-dim: #8b949e;            --border: #30363d;        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        
        /* HEADER & HERO */        header { padding: 4rem 2rem 2rem 2rem; text-align: center; max-width: 900px; margin: 0 auto; }        h1 { font-size: 3.5rem; font-weight: 800; margin: 1rem 0; letter-spacing: -2px; line-height: 1; }        h1 span { background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* AUTH SCREEN */        .auth-screen { max-width: 400px; margin: 4rem auto; padding: 2.5rem; background: var(--card); border-radius: 24px; border: 1px solid var(--border); text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }        .auth-screen h2 { font-size: 1.5rem; margin-bottom: 1rem; }        .auth-screen p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 1.5rem; }

        /* MAIN APP SECTION */        .workspace { max-width: 600px; margin: 2rem auto; padding: 2rem; background: var(--card); border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }                .user-greeting { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 14px; color: var(--text-dim); }        .user-greeting span b { color: var(--text); }        .btn-switch { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; }        .btn-switch:hover { border-color: var(--primary); color: var(--primary); }

        .meter-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-dim); }        .meter { height: 8px; background: var(--noise); border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }        .fill { height: 100%; background: var(--accent); width: 0%; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }

        .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }        input[type="text"] { flex: 1; background: #05070a; border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; color: white; outline: none; }        input[type="text"]:focus { border-color: var(--primary); }        .btn-log { background: var(--primary); border: none; padding: 0 20px; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }

        .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; border: 1px solid transparent; }        .task-item:hover { border-color: var(--border); }        .task-info { display: flex; align-items: center; gap: 10px; }        .done-text { text-decoration: line-through; opacity: 0.4; }

        /* ANALYTICS & LEADERBOARD SECTION */        .analytics { max-width: 900px; margin: 4rem auto; padding: 0 2rem; }        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 2rem; }        .stat-card { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; justify-content: center; }        .stat-card h3 { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }        .stat-card .val { font-size: 2rem; font-weight: 700; color: var(--accent); }        .founder-status { margin-top: 12px; font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; opacity: 0.9; }

        /* LEADERBOARD CARD STYLING */        .leaderboard-card { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); }        .leaderboard-card h3 { color: var(--text-dim); font-size: 14px; margin-bottom: 1.5rem; text-align: center; letter-spacing: 1px; }        .lb-list { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px; }        .lb-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; }        .lb-user { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }        .lb-score { color: var(--accent); font-weight: 700; }

        footer { text-align: center; padding: 4rem; color: var(--text-dim); font-size: 14px; border-top: 1px solid var(--border); margin-top: 4rem; }    </style></head><body>

    <header>        
        <h1>Capture <span>Signal</span>.<br>Filter the Noise.</h1>    </header>

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-container" class="auth-screen" style="display: none;">
        <h2>Welcome to 3 Signal</h2>
        <p>Enter your universal identity to sync your network profile.</p>
        <form id="auth-form" class="input-group" style="flex-direction: column;">
            <input type="text" id="username-input" placeholder="Enter your name..." required autocomplete="off">
            <button type="submit" class="btn-log" style="width: 100%; padding: 12px;">INITIALIZE PROFILE</button>
        </form>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="workspace" id="app-container" style="display: none;">
        <div class="user-greeting">
            <span>Identity: <b id="display-user"></b></span>
            <button class="btn-switch" onclick="switchUser()">Switch Profile</button>
        </div>

        <div class="meter-label">            <span>SIGNAL STRENGTH</span>            <span id="sig-val">0%</span>        </div>
        <div class="meter">            <div id="progress" class="fill"></div>        </div>

        <form class="input-group" id="task-form">            <input type="text" id="task-input" placeholder="Enter signal component..." required>            <button type="submit" class="btn-log">LOG</button>        </form>

        <ul id="task-list" style="list-style: none;"></ul>    </main>

    <section class="analytics">        <div class="stats-grid">            <div class="stat-card">                <h3>DAY'S SCORE</h3>                <div class="val" id="stat-day">0</div>                <div class="founder-status" id="founder-seen"></div>
            </div>            <div class="stat-card">                <h3>LIFETIME SCORE</h3>                <div class="val" id="stat-life">0</div>            </div>
        </div>

        <!-- UNIVERSAL LEADERBOARD -->
        <div class="leaderboard-card">
            <h3>UNIVERSAL NETWORK LEADERBOARD</h3>
            <ul class="lb-list" id="leaderboard-list">
                <!-- Populated dynamically -->
            </ul>
        </div>
    </section>

    <footer>        &copy; 2026 3 Signal AI. Built for Privacy. No tracking. No Noise.    </footer>

    <script>
        let currentUser = localStorage.getItem('3signal_user');
        let allData = JSON.parse(localStorage.getItem('3signal_universal_db')) || {};

        if (!currentUser) {
            document.getElementById('auth-container').style.display = 'block';
        } else {
            initApp();
        }

        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const val = document.getElementById('username-input').value.trim();
            if(!val) return;
            currentUser = val;
            localStorage.setItem('3signal_user', currentUser);
            document.getElementById('auth-container').style.display = 'none';
            initApp();
        };

        function switchUser() {
            localStorage.removeItem('3signal_user');
            location.reload();
        }

        function initApp() {
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('display-user').innerText = currentUser;
            
            if (!allData[currentUser]) {
                allData[currentUser] = { tasks: [] };
            }
            render();
        }

        function getTodayDateString() {
            return new Date().toISOString().split('T')[0];
        }

        function render() {
            const userState = allData[currentUser] || { tasks: [] };
            const tasks = userState.tasks;

            const list = document.getElementById('task-list');
            list.innerHTML = '';                        

            tasks.forEach((t, i) => {                
                const li = document.createElement('li');                
                li.className = 'task-item';                
                li.innerHTML = `                    <div class="task-info">                        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${i})" style="accent-color: var(--accent)">                        <span class="${t.done ? 'done-text' : ''}">${t.text}</span>                    </div>                    <button onclick="del(${i})" style="background:none; border:none; color:var(--text-dim); cursor:pointer;">&times;</button>                `;                
                list.appendChild(li);            });

            const done = tasks.filter(t => t.done).length;            
            const ratio = tasks.length ? Math.round((done / tasks.length) * 100) : 0;                        
            
            document.getElementById('progress').style.width = ratio + '%';            
            document.getElementById('sig-val').innerText = ratio + '%';

            // Calculate Day's Score vs Lifetime Score
            const todayStr = getTodayDateString();
            const dayScore = tasks.filter(t => t.date === todayStr && t.done).length;
            const lifeScore = tasks.filter(t => t.done).length;

            document.getElementById('stat-day').innerText = dayScore;
            document.getElementById('stat-life').innerText = lifeScore;

            // Save state back
            allData[currentUser] = { tasks: tasks };
            localStorage.setItem('3signal_universal_db', JSON.stringify(allData));

            // RENDER UNIVERSAL LEADERBOARD
            const lbContainer = document.getElementById('leaderboard-list');
            lbContainer.innerHTML = '';

            // Aggregate all users and rank by lifetime score descending
            const rankedUsers = Object.keys(allData).map(name => {
                const userTasks = allData[name].tasks || [];
                const totalScore = userTasks.filter(t => t.done).length;
                return { name, score: totalScore };
            }).sort((a, b) => b.score - a.score);

            if (rankedUsers.length === 0) {
                lbContainer.innerHTML = '<li style="text-align:center; color:var(--text-dim); padding: 10px;">No active profiles found.</li>';
            } else {
                rankedUsers.forEach((u, index) => {
                    const li = document.createElement('li');
                    li.className = 'lb-item';
                    li.innerHTML = `
                        <div class="lb-user">
                            <span style="color:var(--text-dim); font-size:12px;">#${index + 1}</span>
                            ${u.name} ${u.name === currentUser ? '(You)' : ''}
                        </div>
                        <div class="lb-score">${u.score} pts</div>
                    `;
                    lbContainer.appendChild(li);
                });
            }

            // Founder check varied time simulation
            let hash = 0;
            const seed = todayStr + "_" + currentUser;
            for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            const randomMinutesOffset = Math.abs(hash) % 240; 
            let targetHour = 21 + Math.floor(randomMinutesOffset / 60);
            let targetMin = randomMinutesOffset % 60;
            
            let period = 'PM';
            let displayHour = targetHour;
            if (targetHour >= 24) { displayHour = targetHour - 24; period = 'AM'; }
            if (displayHour === 0) displayHour = 12;
            else if (displayHour > 12) displayHour -= 12;

            const formattedMin = targetMin < 10 ? '0' + targetMin : targetMin;
            document.getElementById('founder-seen').innerText = `Seen by founder at ${displayHour}:${formattedMin} ${period}`;
        }

        document.getElementById('task-form').onsubmit = (e) => {            
            e.preventDefault();            
            const input = document.getElementById('task-input');            
            const userState = allData[currentUser];
            
            userState.tasks.push({ 
                text: input.value, 
                done: false, 
                date: getTodayDateString() 
            });            
            
            input.value = '';            
            render();        }

        window.toggle = (i) => { 
            allData[currentUser].tasks[i].done = !allData[currentUser].tasks[i].done; 
            render(); 
        }

        window.del = (i) => { 
            allData[currentUser].tasks.splice(i, 1); 
            render(); 
        }
    </script></body></html>
